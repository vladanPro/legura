[package]
name = "legura"
version = "0.0.1"
edition = "2021"
publish = false
default-run = "legura"

[workspace]

[dependencies]
legura-editor = { git = "https://github.com/vladanPro/legura-editor", rev = "abf1be74fbd8ce41bfe30fe418357d00262aa007" }
axonyx-runtime = { version = "0.7.1", features = ["axum"] }
axonyx-ui = "0.0.87"
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
getrandom = "0.2"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tar = { version = "0.4.46", default-features = false }
