name: Legura Pilot CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: legura-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiled-auth:
    name: Registry Compiled Auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.7 --locked --debug
      - name: Verify isolated compiled setup and identity
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Port 3941
