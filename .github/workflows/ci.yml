name: Legura Pilot CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: legura-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-editor-retry:
    name: Native Editor Retry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vladanPro/axonyx-runtime
          ref: 8bdf7d144af0ecc59d1b24dd91f8065b89ae080b
          path: .proof-runtime
      - uses: actions/checkout@v4
        with:
          repository: vladanPro/legura-editor
          ref: abf1be74fbd8ce41bfe30fe418357d00262aa007
          path: .proof-editor
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify native 422 recovery with pinned source candidates
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -PostEditor -NativeRetry -Mode javascript -Port 3948 -RuntimeSource .proof-runtime/crates/axonyx-runtime -EditorSource .proof-editor
          ./scripts/smoke-auth.ps1 -PostEditor -Mode native -Port 3948 -RuntimeSource .proof-runtime/crates/axonyx-runtime -EditorSource .proof-editor
  native-content-http:
    name: Isolated Native Content HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - name: Verify compiled native content with disposable SQLite
        shell: pwsh
        run: |
          rustfmt --edition 2021 --check tests/content-http/native.rs
          if ($LASTEXITCODE -ne 0) { throw "Native fixture formatting failed" }
          ./scripts/smoke-auth.ps1 -Content -Port 3946
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify pinned editor create, retry, reload and read-only fallback
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode native -Port 3946
      - name: Verify normal post forms with rich and plain content
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ActiveEditor -NativeRetry -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ActiveEditor -Mode native -Port 3946
  compiled-auth:
    name: Registry Compiled Auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - name: Verify SQLite maintenance safety
        run: |
          cargo fmt --all -- --check
          cargo test --locked --bin legura-maintenance
          cargo test --locked --lib
          cargo test --locked --test content-check
      - name: Verify isolated native content preparation
        run: |
          cargo fmt --manifest-path tests/native-content/Cargo.toml -- --check
          cargo run --locked --manifest-path tests/native-content/Cargo.toml
      - name: Verify isolated compiled setup and identity
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Port 3941 -Posts -BackupRestore
      - name: Verify first-run local preparation
        shell: pwsh
        run: ./scripts/smoke-local.ps1 -Port 3943 -Package
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Verify browser forms with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode native
      - name: Verify posts with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode native
