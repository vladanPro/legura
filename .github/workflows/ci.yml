name: Legura Pilot CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: legura-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-upload-http:
    name: Isolated Media Upload HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published private-binary CLI
        run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug --force
      - name: Check storage hook formatting
        shell: pwsh
        run: |
          rustfmt --edition 2021 --check src/native_storage.rs
          if ($LASTEXITCODE -ne 0) { throw "Media hook formatting failed" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install existing test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove media library recovery and isolated activation
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Media -ScopedMedia -MediaBrowser -ToolPath (Get-Command cargo-axonyx).Source -Port 3963
  media-storage:
    name: Local Media Storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib
      - run: cargo test --locked --test media-check
      - run: cargo test --locked --test private-media-read
      - run: cargo test --locked --test post-images
      - run: cargo test --locked --test media-delete
      - run: cargo test --locked --test media-archive
      - run: cargo test --locked --bin legura-maintenance
      - run: cargo clippy --locked --lib --tests -- -D warnings
  source-format:
    name: Axonyx Source Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug
      - run: bash scripts/format-sources.sh --check
      - name: Check staged-source hook safety
        shell: pwsh
        run: ./scripts/test-format-hook.ps1 -FormatterPath (Get-Command cargo-ax).Source
  native-editor-retry:
    name: Native Editor Retry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published private-binary CLI
        run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify native 422 recovery with registry runtime and pinned editor
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -PostEditor -NativeRetry -Mode javascript -Port 3948
          ./scripts/smoke-auth.ps1 -PostEditor -Mode native -Port 3948
  native-content-http:
    name: Isolated Native Content HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published private-binary CLI
        run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug
      - name: Verify compiled native content with disposable SQLite
        shell: pwsh
        run: |
          rustfmt --edition 2021 --check tests/content-http/native.rs
          if ($LASTEXITCODE -ne 0) { throw "Native fixture formatting failed" }
          ./scripts/smoke-auth.ps1 -Content -Port 3946
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify pinned editor create, retry, reload and read-only fallback
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode native -Port 3946
      - name: Verify normal post forms with rich and plain content
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ActiveEditor -NativeRetry -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ActiveEditor -Mode native -Port 3946
  native-package:
    name: Native Package Archive
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published private-binary CLI
        run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug
      - name: Verify archive extraction and toolchain-free native flow
        shell: pwsh
        run: ./scripts/smoke-local.ps1 -Port 3943 -Package -Systemd
      - uses: actions/checkout@v4
        with:
          ref: 8d47e6165a6df6d5ea4d510db9b20ba811846493
          path: prior
      - uses: actions/checkout@v4
        with:
          ref: f4b065a60150fe94e98f19f4d8af4b52667f0227
          path: pilot
      - name: Verify 0.0.1 backup compatibility with 0.0.2
        shell: pwsh
        run: |
          $priorPackage = Join-Path $env:RUNNER_TEMP ('legura-prior-package-' + [Guid]::NewGuid().ToString('N'))
          $pilotPackage = Join-Path $env:RUNNER_TEMP ('legura-pilot-package-' + [Guid]::NewGuid().ToString('N'))
          $currentPackage = Join-Path $env:RUNNER_TEMP ('legura-current-package-' + [Guid]::NewGuid().ToString('N'))
          ./prior/scripts/local.ps1 -Task init
          ./prior/scripts/package.ps1 -OutputDirectory $priorPackage
          ./pilot/scripts/local.ps1 -Task init
          ./pilot/scripts/package.ps1 -OutputDirectory $pilotPackage
          ./scripts/smoke-cross-version.ps1 -PriorTool (Join-Path $priorPackage 'legura-maintenance') -CurrentTool (Join-Path $pilotPackage 'legura-maintenance')
          ./scripts/smoke-package-cutover.ps1 -PriorPackage $priorPackage -CurrentPackage $pilotPackage -Port 3947
          ./scripts/local.ps1 -Task init
          ./scripts/package.ps1 -OutputDirectory $currentPackage
          python -B ./scripts/smoke-schema-upgrade.py $pilotPackage $currentPackage
          if ($LASTEXITCODE -ne 0) { throw 'Pre-Pages schema upgrade rehearsal failed' }
          $inputDirectory = Join-Path $env:RUNNER_TEMP 'legura-clean-linux-input'
          New-Item -ItemType Directory -Path $inputDirectory | Out-Null
          ./scripts/archive-package.ps1 -PackageDirectory $currentPackage -OutputDirectory $inputDirectory
      - name: Install the archive on Linux without a toolchain
        run: |
          docker build -t legura-clean-linux - <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65534:65534 --tmpfs /tmp:rw,exec,mode=1777 \
            --mount "type=bind,source=$RUNNER_TEMP/legura-clean-linux-input,target=/input,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/smoke-clean-linux.py,target=/smoke.py,readonly" \
            legura-clean-linux sh -eu -c 'set -- /input/*.tar.gz; test "$#" -eq 1; exec python3 /smoke.py "$1"'
  compiled-auth:
    name: Registry Compiled Auth
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published private-binary CLI
        run: cargo install cargo-axonyx --version '=0.8.9' --locked --debug
      - name: Verify SQLite maintenance safety
        run: |
          cargo fmt --all -- --check
          cargo test --locked --bin legura-maintenance
          cargo test --locked --lib
          cargo test --locked --test content-check
      - name: Verify isolated native content preparation
        run: |
          cargo fmt --manifest-path tests/native-content/Cargo.toml -- --check
          cargo run --locked --manifest-path tests/native-content/Cargo.toml
      - name: Verify isolated compiled setup and identity
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Theme -BackupRestore
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Verify same-URL and native save navigation synchronization
        run: node --test tests/document-navigation.test.mjs
      - name: Verify browser forms with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode native
      - name: Verify posts with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode native
