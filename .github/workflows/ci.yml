name: Legura Pilot CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: legura-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-upload-http:
    name: Isolated Media Upload HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published storage-startup CLI
        run: cargo install cargo-axonyx --version '=0.6.15' --locked --debug --force
      - name: Check storage hook formatting
        shell: pwsh
        run: |
          rustfmt --edition 2021 --check src/native_storage.rs
          if ($LASTEXITCODE -ne 0) { throw "Media hook formatting failed" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install existing test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove media library recovery and isolated activation
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Media -MediaBrowser -ToolPath (Get-Command cargo-axonyx).Source -Port 3963
  scoped-media-source:
    name: Scoped Media Source Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vladanPro/axonyx-framework
          ref: be84f76e2754d41ab5d13642ff840d7511a46966
          submodules: recursive
          path: .test-toolchain
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .test-toolchain -> target
      - name: Build pinned source CLI and prove narrow Media budgets
        shell: pwsh
        run: |
          $manifest = Join-Path $PWD '.test-toolchain/Cargo.toml'
          # Framework does not track Cargo.lock; resolve once, then build locked.
          & cargo generate-lockfile --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Source CLI test lockfile generation failed' }
          & cargo build --locked --manifest-path $manifest -p cargo-axonyx --bin cargo-axonyx
          if ($LASTEXITCODE -ne 0) { throw 'Source CLI build failed' }
          $metadata = & cargo metadata --manifest-path $manifest --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Source CLI metadata failed' }
          $tool = Join-Path $metadata.target_directory 'debug/cargo-axonyx'
          $runtime = Join-Path $PWD '.test-toolchain/vendor/axonyx-runtime/crates/axonyx-runtime'
          ./scripts/smoke-auth.ps1 -Media -ScopedMedia -ToolPath $tool -RuntimeSource $runtime -Port 3964
  media-storage:
    name: Local Media Storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib
      - run: cargo test --locked --test media-check
      - run: cargo test --locked --test media-archive
      - run: cargo test --locked --bin legura-maintenance
      - run: cargo clippy --locked --lib --tests -- -D warnings
  source-format:
    name: Axonyx Source Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-axonyx --git https://github.com/vladanPro/axonyx-framework --rev 79c58a2968307b4fd4301c33b31b751d6e94b823 --force
      - run: bash scripts/format-sources.sh --check
      - name: Check staged-source hook safety
        shell: pwsh
        run: ./scripts/test-format-hook.ps1 -FormatterPath (Get-Command cargo-ax).Source
  native-editor-retry:
    name: Native Editor Retry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vladanPro/axonyx-runtime
          ref: 8bdf7d144af0ecc59d1b24dd91f8065b89ae080b
          path: .proof-runtime
      - uses: actions/checkout@v4
        with:
          repository: vladanPro/legura-editor
          ref: abf1be74fbd8ce41bfe30fe418357d00262aa007
          path: .proof-editor
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify native 422 recovery with pinned source candidates
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -PostEditor -NativeRetry -Mode javascript -Port 3948 -RuntimeSource .proof-runtime/crates/axonyx-runtime -EditorSource .proof-editor
          ./scripts/smoke-auth.ps1 -PostEditor -Mode native -Port 3948 -RuntimeSource .proof-runtime/crates/axonyx-runtime -EditorSource .proof-editor
  native-content-http:
    name: Isolated Native Content HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - name: Verify compiled native content with disposable SQLite
        shell: pwsh
        run: |
          rustfmt --edition 2021 --check tests/content-http/native.rs
          if ($LASTEXITCODE -ne 0) { throw "Native fixture formatting failed" }
          ./scripts/smoke-auth.ps1 -Content -Port 3946
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test-only browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify pinned editor create, retry, reload and read-only fallback
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ContentEditor -Mode native -Port 3946
      - name: Verify normal post forms with rich and plain content
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -ActiveEditor -NativeRetry -Mode javascript -Port 3946
          ./scripts/smoke-auth.ps1 -ActiveEditor -Mode native -Port 3946
  compiled-auth:
    name: Registry Compiled Auth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Install published Axonyx CLI
        run: cargo install cargo-axonyx --version 0.6.13 --locked --debug
      - name: Verify SQLite maintenance safety
        run: |
          cargo fmt --all -- --check
          cargo test --locked --bin legura-maintenance
          cargo test --locked --lib
          cargo test --locked --test content-check
      - name: Verify isolated native content preparation
        run: |
          cargo fmt --manifest-path tests/native-content/Cargo.toml -- --check
          cargo run --locked --manifest-path tests/native-content/Cargo.toml
      - name: Verify isolated compiled setup and identity
        shell: pwsh
        run: ./scripts/smoke-auth.ps1 -Port 3941 -Posts -BackupRestore
      - name: Verify first-run local preparation
        shell: pwsh
        run: ./scripts/smoke-local.ps1 -Port 3943 -Package
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Verify same-URL and native save navigation synchronization
        run: node --test tests/document-navigation.test.mjs
      - name: Verify browser forms with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Mode native
      - name: Verify posts with and without JavaScript
        shell: pwsh
        run: |
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode javascript
          ./scripts/smoke-auth.ps1 -Port 3941 -Posts -Mode native
